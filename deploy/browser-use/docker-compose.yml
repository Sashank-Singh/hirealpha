# HireAlpha Cloud Computer — agent worker + the exact browser it streams.
# In Coolify, deploy this compose file from the repository checkout and route
# BROWSER_USE_DOMAIN to port 6080.

services:
  browser-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    shm_size: "2gb"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hirealpha-browser.rule=Host(`${BROWSER_USE_DOMAIN:-browser.hirealpha.chat}`)"
      - "traefik.http.routers.hirealpha-browser.entrypoints=https"
      - "traefik.http.routers.hirealpha-browser.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hirealpha-browser.service=hirealpha-browser-stream"
      - "traefik.http.services.hirealpha-browser-stream.loadbalancer.server.port=6080"

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KERNEL_API_KEY=${KERNEL_API_KEY}
      - KERNEL_PROJECT_ID=${KERNEL_PROJECT_ID}
      - KERNEL_TELEMETRY=${KERNEL_TELEMETRY:-true}
      - KERNEL_SESSION_SECONDS=${KERNEL_SESSION_SECONDS:-3600}
      - HIREALPHA_TASK_RECORD=${HIREALPHA_TASK_RECORD:-1}
      - HIREALPHA_RECEIPT_GATE=${HIREALPHA_RECEIPT_GATE:-1}
      - GMI_API_KEY=${GMI_API_KEY}
      - GMI_BASE_URL=${GMI_BASE_URL:-https://api.gmi-serving.com/v1}
      - AGENT_VISION_MODEL=${AGENT_VISION_MODEL:-zai-org/GLM-5.3-Flash}
      - KERNEL_AGENT_DRIVER=${KERNEL_AGENT_DRIVER:-browser-use}
      - BROWSER_USE_MAX_STEPS=${BROWSER_USE_MAX_STEPS:-40}
      - HIREALPHA_VAULT_KEY=${HIREALPHA_VAULT_KEY:-}
      - OPENBAO_ADDR=${OPENBAO_ADDR}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN}
      - USER_SPEND_MAX_CENTS=${USER_SPEND_MAX_CENTS:-20000}
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN:-}
      - OP_VAULT_ID=${OP_VAULT_ID:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - HIREALPHA_APP_URL=${HIREALPHA_APP_URL:-https://hirealpha.chat}
      - CHROME_VNC_PASSWORD=${CHROME_VNC_PASSWORD}
      - BROWSER_HEADFUL=1
      - BROWSER_SCREEN_SIZE=${BROWSER_SCREEN_SIZE:-1280x800x24}
      # One visible browser per display. Scale horizontally with isolated
      # workers/stream hostnames when multi-user concurrency is needed.
      - WORKER_CONCURRENCY=1

    expose:
      - "3000"
      - "6080"
