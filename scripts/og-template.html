<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0c0e11; }
  .card {
    width: 1200px; height: 630px;
    background:
      radial-gradient(620px 620px at 12% -8%, rgba(96,165,250,.16), transparent 62%),
      radial-gradient(560px 560px at 96% 108%, rgba(110,231,183,.12), transparent 60%),
      #0c0e11;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 84px; overflow: hidden;
  }
  .orb {
    width: 114px; height: 114px; border-radius: 26px;
    background: linear-gradient(180deg,
      #ff5f57 0%, #ff5f57 16%, #ff9f43 16%, #ff9f43 33%,
      #ffd60a 33%, #ffd60a 50%, #34c759 50%, #34c759 67%,
      #32ade6 67%, #32ade6 84%, #5e5ce6 84%, #5e5ce6 100%);
    box-shadow: 0 7px 20px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14);
    margin-bottom: 40px;
  }
  .title {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 800; font-size: 92px; line-height: 1.04; color: #f5f6f7;
    letter-spacing: -0.02em; margin-bottom: 16px;
    max-width: 1010px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .desc {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400; font-size: 30px; color: #98a0ab; margin-bottom: 36px;
    max-width: 980px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .foot { display: flex; align-items: center; }
  .chip {
    margin-left: auto; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 22px; color: #8b93a0; border: 1px solid #262b32;
    border-radius: 999px; padding: 8px 22px; background: rgba(255,255,255,.03);
  }
</style>
</head>
<body style="height:100vh; display:flex; align-items:center; justify-content:center;">
  <div class="card" id="card">
    <div class="title" id="t">Apps</div>
    <div class="desc" id="d">Tap one to open it.</div>
    <div class="foot">
      <div class="chip">Opens in iMessage</div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('t')) document.getElementById('t').textContent = q.get('t');
    if (q.get('d')) document.getElementById('d').textContent = q.get('d');
    if (q.get('b')) document.getElementById('b').textContent = q.get('b');
  </script>
</body>
</html>
